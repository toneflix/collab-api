name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toneflix_collab_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # S3 API for the remote storage tests
      moto:
        image: motoserver/moto:5.2.4
        ports:
          - 9090:5000

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: toneflix_collab_tests
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      S3_TEST_ENDPOINT: http://127.0.0.1:9090

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, gd, intl, zip, exif, bcmath
          coverage: none

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg faust

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      # composer.lock is not committed, so dependencies resolve from composer.json
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Prepare the app
        run: |
          cp .env.ci .env
          php artisan key:generate
          php artisan migrate --seed --force

      # Config, routes, events and views must all be cacheable for production.
      # Clear them after so the tests run against the live config.
      - name: Check the cache commands
        run: |
          php artisan optimize
          php artisan optimize:clear

      - name: Run tests
        run: php artisan test
