name: Push style tagger

# Builds models/style-tagger with Cog and pushes it to Replicate. Needs the
# REPLICATE_API_TOKEN secret. The model is created on the first run.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Replicate model to push to, as owner/name
        required: true
        default: toneflix/style-tagger
      hardware:
        description: Hardware the model runs on when it is first created
        required: true
        default: cpu
        type: choice
        options: [cpu, gpu-t4]

jobs:
  push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: models/style-tagger

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: replicate/setup-cog@v2
        with:
          token: ${{ secrets.REPLICATE_API_TOKEN }}

      - name: Create the model if it is new
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          MODEL: ${{ inputs.model }}
          HARDWARE: ${{ inputs.hardware }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $REPLICATE_API_TOKEN" "https://api.replicate.com/v1/models/$MODEL")
          if [ "$status" = "404" ]; then
            curl -sf -X POST https://api.replicate.com/v1/models \
              -H "Authorization: Bearer $REPLICATE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              -d "{\"owner\": \"${MODEL%%/*}\", \"name\": \"${MODEL#*/}\", \"visibility\": \"public\", \"hardware\": \"$HARDWARE\", \"description\": \"Scores songs against genre and mood labels with CLAP (laion/larger_clap_music).\"}"
          fi

      - name: Push
        run: cog push "r8.im/${{ inputs.model }}"
